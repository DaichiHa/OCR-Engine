[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-pdf-txt"
version = "0.1.0"
description = "Minimal PDF text-layer extraction CLI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyPDF2>=3.0.0",
]

[project.scripts]
pdf2txt = "ocr_pdf_txt.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
