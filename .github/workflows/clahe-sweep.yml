name: CLAHE Sweep

on:
  workflow_dispatch: {}

jobs:
  clahe-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requirements (if present)
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          else
            python -m pip install --upgrade pip
            pip install --no-cache-dir pillow numpy opencv-python-headless
          fi

      - name: Run CLAHE sweep
        shell: bash
        run: |
          if [ -f ops/clahe_sweep_page010.py ]; then
            python ops/clahe_sweep_page010.py
          else
            echo 'CLAHE sweep script not found; skipping'
            exit 0
          fi

      - name: Collect and upload inputs and results
        shell: bash
        run: |
          mkdir -p artifacts/clahe-sweep
          # copy expected outputs if they exist
          shopt -s nullglob || true
          cp -v ops/page_010_clahe_*.png artifacts/clahe-sweep/ 2>/dev/null || true
          cp -v ops/clahe_sweep_page010_results.json artifacts/clahe-sweep/ 2>/dev/null || true
          cp -v ops/clahe_sweep_*.rapid.txt artifacts/clahe-sweep/ 2>/dev/null || true
          # upload via actions/upload-artifact step

      - name: Upload clahe-sweep artifact
        uses: actions/upload-artifact@v4
        with:
          name: clahe-sweep-results
          path: artifacts/clahe-sweep

      - name: Clean workspace generated files
        shell: bash
        run: |
          # remove any generated files to avoid accidental commits
          git clean -fdX || true
