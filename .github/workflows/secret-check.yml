name: Secret Check

on:
  workflow_dispatch: {}

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        run: |
          if [ -z "${{ secrets.OCR_ENGINE_GH_TOKEN }}" ]; then
            echo "OCR_ENGINE_GH_TOKEN is NOT set";
            exit 1;
          else
            echo "OCR_ENGINE_GH_TOKEN is set";
          fi
      - name: Test GitHub API auth (status only)
        env:
          TOKEN: ${{ secrets.OCR_ENGINE_GH_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $TOKEN" https://api.github.com/user)
          echo "GitHub API status code: $status"
