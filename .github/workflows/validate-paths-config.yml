name: Validate ops/paths_config.json

on:
  pull_request:
    paths:
      - 'ops/paths_config.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON syntax and required keys
        run: |
          python - <<'PY'
          import json,sys,os
          p='ops/paths_config.json'
          if not os.path.exists(p):
              print('ERROR: file not found:',p)
              sys.exit(1)
          try:
              data=json.load(open(p))
          except Exception as e:
              print('ERROR: invalid JSON:',e)
              sys.exit(2)
          required=['tesseract','ollama']
          missing=[k for k in required if k not in data or not data[k]]
          if missing:
              print('ERROR: Missing or empty keys:',missing)
              sys.exit(3)
          print('OK: ops/paths_config.json present and keys present:',', '.join(required))
          PY
