name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install repo requirements (may include optional heavy packages)
          pip install -r requirements.txt || pip install black isort flake8 pytest
          pip install black isort flake8 pytest

      - name: Black check
        run: python -m black . --line-length 120 --check

      - name: isort check
        run: python -m isort . --profile black --check-only

      - name: flake8
        run: python -m flake8 . --count --statistics
      - name: Run tests
        run: |
          # Run only the small targeted tests to keep CI fast
          python -m pytest -q tests/test_eval_utils.py
name: CI

on:
  push:
    branches: [ main, master, add-tesseract-assets, add-docker-ci ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn libgl1 poppler-utils
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (flake8 optional)
        run: |
          echo "No lint configured; add steps if desired"
      - name: Quick OCR smoke test (no network)
        run: |
          python quick_ocr_test.py --pdf README.md --page 1 || true
