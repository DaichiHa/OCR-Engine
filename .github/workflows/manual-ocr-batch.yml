name: Manual OCR Batch

on:
  workflow_dispatch: {}

jobs:
  run-ocr-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requirements (if present)
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          else
            echo 'No requirements.txt found; attempting to install light deps'
            python -m pip install --upgrade pip
            pip install --no-cache-dir pillow numpy
          fi

      - name: Run OCR batch (if runtime available)
        shell: bash
        run: |
          python ops/run_rapidocr_action.py

      - name: Collect OCR artifacts
        shell: bash
        run: |
          mkdir -p artifacts/ocr-results
          shopt -s nullglob || true
          cp -v ops/rapid_page_*.json artifacts/ocr-results/ 2>/dev/null || true
          cp -v ops/rapid_page_*.txt artifacts/ocr-results/ 2>/dev/null || true
          cp -v ops/*rapid_page_*.json artifacts/ocr-results/ 2>/dev/null || true
          cp -v ops/*rapid_page_*.txt artifacts/ocr-results/ 2>/dev/null || true

      - name: Upload ocr-results artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocr-results
          path: artifacts/ocr-results

      - name: Clean workspace generated files
        shell: bash
        run: |
          git clean -fdX || true
